# Gradle JVM / parallelism
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod metadata (shared across all MC versions)
mod_version=1.0.0
maven_group=com.lukarbonite.iseeyourchunks
archives_base_name=iseeyourchunks

# Shared build-tool versions (same across all MC versions)
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# MC-version-specific properties live in each version's gradle.properties
# e.g. 26.2/fabric/gradle.properties
