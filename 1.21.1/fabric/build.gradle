// MC 1.21.1 — Fabric, Mojang mappings (obfuscated runtime), Java 21
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
}

loom {
    mixin {
        defaultRefmapName = "iseeyourchunks.refmap.json"
    }
    // Separate run directories so runClient and runServer can run at once without locking each other's files.
    runs {
        client { runDir "run/client" }
        server { runDir "run/server" }
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java')
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 21
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    // MC 1.21.1 is obfuscated — use modImplementation, so loom remaps against Mojang mappings.
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Voxy draws the streamed far terrain and is called directly (see the client/compat classes) rather
    // than reflected into. This fork's jar is intermediary-mapped, so it MUST go through modCompileOnly
    // (not compileOnly): loom remaps its Minecraft references to Mojang names so they line up with ours.
    // Voxy is never on the runtime classpath unless the user installs it.
    modCompileOnly(files("${rootProject.projectDir}/libs/${minecraft_version}/voxy-0.2.19-beta+mc1.21.1-22f9ff6e4c7d254c669438b6a7d32522e8beaea1.jar"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
