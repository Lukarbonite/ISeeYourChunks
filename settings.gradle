pluginManagement {
    repositories {
        maven { name = 'Fabric';       url = 'https://maven.fabricmc.net/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'iseeyourchunks'

// ─── Shared source container (no build output, Java source only) ─────────────
include ':common'   // Business logic, config, network, shared mixins, platform SPI

// ─── MC 1.21.1 — Fabric, Mojang mappings (obfuscated runtime), Java 21 ───────
include ':mc1_21_1-fabric'
project(':mc1_21_1-fabric').projectDir = file('1.21.1/fabric')

// ─── MC 26.2 — Fabric, unobfuscated (no mappings needed), Java 25 ────────────
include ':mc26_2-fabric'
project(':mc26_2-fabric').projectDir = file('26.2/fabric')
