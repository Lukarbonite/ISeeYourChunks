// MC 26.1.2: Fabric, unobfuscated (no remapping), Java 25
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
}

loom {
    noIntermediateMappings()
    mixin {
        defaultRefmapName = "iseeyourchunks.refmap.json"
    }
    // Separate run directories so runClient and runServer can run at once without locking each other's files.
    runs {
        client { runDir "run/client" }
        server { runDir "run/server" }
    }
}

sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java')
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources')
            ]
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release  = 25
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // MC 26.1.2 is unobfuscated: use implementation, not modImplementation
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Voxy draws the streamed far terrain and is called directly (see VoxyCompat) rather than
    // reflected into. The bundled jar is already Mojang-mapped, so no remapping is needed, and Voxy
    // is never on the runtime classpath unless the user installs it.
    compileOnly(files("${rootProject.projectDir}/libs/${minecraft_version}/voxy-0.2.18-beta-26.1.2.jar"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-fabric"
            from components.java
        }
    }
}
